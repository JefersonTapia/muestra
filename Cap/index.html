<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitaciones · Registro SST</title>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    :root {
      --azul-primario: #1e2b3c;
      --azul-secundario: #2c3e50;
      --azul-acento: #3498db;
      --gris-fondo: #f5f7fa;
      --gris-borde: #e5eaf0;
      --gris-texto: #5f6f80;
      --blanco: #ffffff;
      --verde: #27ae60;
      --naranja: #e67e22;
      --rojo: #e74c3c;
      --sombra-suave: 0 2px 8px rgba(30, 43, 60, 0.04);
      --sombra-media: 0 8px 24px rgba(30, 43, 60, 0.08);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--gris-fondo);
      color: var(--azul-primario);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body { padding: 20px; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* ===== HEADER ===== */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .page-title .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      box-shadow: 0 6px 16px rgba(52, 152, 219, 0.3);
      flex-shrink: 0;
    }

    .page-title h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--azul-primario);
      margin: 0;
      letter-spacing: -0.4px;
    }

    .page-title .subtitle {
      font-size: 0.85rem;
      color: var(--gris-texto);
      margin-top: 2px;
    }

    .badge-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(52, 152, 219, 0.12);
      color: #2980b9;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--blanco);
      border-radius: 16px;
      border: 1px solid var(--gris-borde);
      box-shadow: var(--sombra-suave);
      padding: 26px 30px;
      margin-bottom: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--azul-primario);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gris-borde);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .card-title i {
      color: var(--azul-acento);
      font-size: 1rem;
    }

    /* ===== FORM GRID ===== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 24px;
    }

    .full-width { grid-column: span 2; }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--gris-texto);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .field-group label i {
      color: var(--azul-acento);
      font-size: 0.75rem;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gris-borde);
      border-radius: 12px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--gris-fondo);
      color: var(--azul-primario);
      transition: all 0.2s;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: var(--azul-acento);
      background: var(--blanco);
      box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
    }

    .field-group textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .row-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ===== PHOTO AREA ===== */
    .photo-area {
      border: 2px dashed #a6c0d2;
      border-radius: 16px;
      padding: 26px 20px;
      text-align: center;
      background: var(--gris-fondo);
      cursor: pointer;
      transition: all 0.2s;
      color: var(--azul-acento);
    }

    .photo-area:hover {
      background: #eaf4fd;
      border-color: var(--azul-acento);
    }

    .photo-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
      opacity: 0.7;
    }

    .photo-hint {
      font-size: 0.78rem;
      color: var(--gris-texto);
      margin-top: 4px;
    }

    /* ===== PREVIEW GRID ===== */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .preview-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--gris-borde);
      background: var(--gris-fondo);
      animation: previewIn 0.3s ease;
    }

    @keyframes previewIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-item .preview-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .preview-item .preview-remove:hover {
      background: #dc2626;
      transform: scale(1.1);
    }

    .preview-item .preview-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 6px;
      font-size: 0.68rem;
      color: white;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-counter {
      font-size: 0.82rem;
      color: var(--gris-texto);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-counter i {
      color: var(--verde);
    }

    /* ===== BUTTONS ===== */
    .action-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--gris-borde);
    }

    .btn {
      padding: 12px 26px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.88rem;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(39, 174, 96, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--blanco);
      border: 1.5px solid var(--gris-borde);
      color: var(--gris-texto);
    }

    .btn-secondary:hover {
      background: #e9eef4;
      border-color: #cbd5e1;
      color: var(--azul-primario);
    }

    /* ===== MENSAJE POPUP ===== */
    .mensaje-popup {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 14px 22px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 12px 32px rgba(30, 43, 60, 0.35);
      z-index: 10000;
      animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 40px);
    }

    .mensaje-popup.exito { background: linear-gradient(135deg, #27ae60 0%, #1e8449 100%); }
    .mensaje-popup.error { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); }
    .mensaje-popup.info  { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ===== OVERLAY DE CARGA ===== */
    .overlay-carga {
      position: fixed;
      inset: 0;
      background: rgba(15, 25, 35, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      font-size: 1rem;
      font-weight: 500;
      flex-direction: column;
      gap: 18px;
    }

    .overlay-carga.activo { display: flex; }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== FOOTER HINT ===== */
    .form-footer-hint {
      font-size: 0.75rem;
      color: var(--gris-texto);
      text-align: right;
      margin-top: 8px;
      opacity: 0.8;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .page-title h1 { font-size: 1.15rem; }
      .page-title .icon-box { width: 42px; height: 42px; font-size: 1.1rem; }

      .card { padding: 20px; }
      .form-grid { grid-template-columns: 1fr; gap: 16px; }
      .full-width { grid-column: span 1; }
      .row-duo { grid-template-columns: 1fr; }

      .action-buttons { flex-direction: column-reverse; }
      .btn { width: 100%; }

      .preview-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 8px;
      }

      .mensaje-popup {
        top: 12px;
        right: 12px;
        left: 12px;
        max-width: none;
      }
    }

    @media (max-width: 380px) {
      .page-title h1 { font-size: 1rem; }
      .badge-form { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      <div class="icon-box">
        <i class="fas fa-chalkboard-user"></i>
      </div>
      <div>
        <h1>Registro de Capacitaciones</h1>
        <div class="subtitle">Programa SST · Control de actividades formativas</div>
      </div>
    </div>
    <div class="badge-form">
      <i class="fas fa-file-alt"></i> SST-CAP-2026
    </div>
  </div>

  <!-- FORM CARD -->
  <div class="card">
    <div class="card-title">
      <i class="fas fa-pen-to-square"></i>
      Datos de la Capacitación
    </div>

    <form id="formCapacitacion" onsubmit="enviarCapacitacion(event)">
      <div class="form-grid">

        <!-- Empresa -->
        <div class="field-group">
          <label for="empresa"><i class="fas fa-building"></i> Empresa / Unidad *</label>
          <select id="empresa" required>
            <option value="">Seleccionar</option>
            <option>Cerro Verde</option>
            <option>Quellaveco</option>
            <option>Hudbay</option>
            <option>Sourthern</option>
            <option>Marcobre</option>
            <option>PROSERING</option>
            <option>Otra</option>
          </select>
        </div>

        <!-- Capacitador -->
        <div class="field-group">
          <label for="capacitador"><i class="fas fa-user-tie"></i> Capacitador / Relator *</label>
          <input type="text" id="capacitador" placeholder="Nombre completo" required>
        </div>

        <!-- Fecha -->
        <div class="field-group">
          <label for="fechaCap"><i class="fas fa-calendar-alt"></i> Fecha de actividad *</label>
          <input type="date" id="fechaCap" required value="2026-03-20">
        </div>

        <!-- Tipo de actividad -->
        <div class="field-group">
          <label for="tipoActividad"><i class="fas fa-tag"></i> Tipo de actividad *</label>
          <select id="tipoActividad" required>
            <option value="">-- Seleccione --</option>
            <option>Charla de 5 minutos</option>
            <option>Capacitación programada</option>
            <option>Inducción general</option>
            <option>Entrenamiento específico</option>
            <option>Simulacro</option>
          </select>
        </div>

        <!-- Tema -->
        <div class="full-width field-group">
          <label for="tema"><i class="fas fa-book-open"></i> Tema desarrollado *</label>
          <input type="text" id="tema" placeholder="Ej: Uso correcto de EPP, Trabajo en altura..." required>
        </div>

        <!-- Cantidad de personal -->
        <div class="full-width field-group">
          <label><i class="fas fa-users"></i> Cantidad de personal *</label>
          <div class="row-duo">
            <input type="number" id="total" placeholder="Programado" min="0" required>
            <input type="number" id="presente" placeholder="Asistentes" min="0" required>
          </div>
        </div>

        <!-- Observaciones -->
        <div class="full-width field-group">
          <label for="observaciones"><i class="fas fa-comment-dots"></i> Observaciones / comentarios</label>
          <textarea id="observaciones" placeholder="Dificultades, temas pendientes, evaluaciones, etc."></textarea>
        </div>

        <!-- Evidencia fotográfica -->
        <div class="full-width field-group">
          <label><i class="fas fa-camera"></i> Evidencia fotográfica</label>
          <div class="photo-area" onclick="document.getElementById('fileInput').click();">
            <div class="photo-icon">📸</div>
            <div>Haga clic para seleccionar imágenes</div>
            <div class="photo-hint">JPEG, PNG hasta 10MB · Múltiples archivos</div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
          </div>
          <div id="previewContenedor" class="preview-grid"></div>
          <div id="previewContador" class="preview-counter"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-secondary" type="button" onclick="limpiarTodo()">
          <i class="fas fa-eraser"></i> Limpiar
        </button>
        <button class="btn btn-primary" type="submit" id="btnSubmit">
          <i class="fas fa-save"></i>
          <span id="btnText">Guardar y descargar PDF</span>
        </button>
      </div>

      <div class="form-footer-hint">
        Los campos marcados con * son obligatorios · Versión 2.0
      </div>
    </form>
  </div>

</div>

<!-- OVERLAY DE CARGA -->
<div class="overlay-carga" id="overlayCarga">
  <div class="spinner"></div>
  <div id="overlayTexto">Guardando capacitación...</div>
</div>

<script>
  // ============================================
  // CONFIGURACIÓN SUPABASE
  // ============================================
  const SUPABASE_URL = 'https://rvcepyqjmobrdjalvvst.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_U94_NuEFTcz0HvQFjLHRzA_OxV3k5HN';

  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ===== VARIABLES GLOBALES =====
  let archivosSeleccionados = [];
  let imagenesBase64 = [];

  // ===== VISTA PREVIA =====
  function manejarSeleccionFotos(event) {
    const nuevos = Array.from(event.target.files);
    archivosSeleccionados = archivosSeleccionados.concat(nuevos);
    renderPreview();
    actualizarInputFile();
  }

  function renderPreview() {
    const contenedor = document.getElementById('previewContenedor');
    const contador = document.getElementById('previewContador');
    contenedor.innerHTML = '';
    imagenesBase64 = [];

    if (archivosSeleccionados.length === 0) {
      contador.innerHTML = '';
      return;
    }

    let cargadas = 0;

    archivosSeleccionados.forEach((archivo, index) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        imagenesBase64[index] = {
          name: archivo.name,
          dataUrl: e.target.result
        };

        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <img src="${e.target.result}" alt="${archivo.name}">
          <button type="button" class="preview-remove" onclick="eliminarFoto(${index})">×</button>
          <div class="preview-name">${archivo.name}</div>
        `;
        contenedor.appendChild(div);

        cargadas++;
        if (cargadas === archivosSeleccionados.length) {
          contador.innerHTML = `<i class="fas fa-check-circle"></i> ${archivosSeleccionados.length} imagen(es) lista(s) para el PDF`;
        }
      };
      reader.readAsDataURL(archivo);
    });
  }

  function eliminarFoto(index) {
    archivosSeleccionados.splice(index, 1);
    renderPreview();
    actualizarInputFile();
  }

  function actualizarInputFile() {
    const dt = new DataTransfer();
    archivosSeleccionados.forEach(f => dt.items.add(f));
    document.getElementById('fileInput').files = dt.files;
  }

  function limpiarTodo() {
    if (!confirm('¿Limpiar todo el formulario?')) return;
    document.getElementById('formCapacitacion').reset();
    document.getElementById('fechaCap').value = '2026-03-20';
    archivosSeleccionados = [];
    imagenesBase64 = [];
    renderPreview();
  }

  // ===== MENSAJES =====
  function mostrarMensaje(texto, tipo) {
    const anterior = document.querySelector('.mensaje-popup');
    if (anterior) anterior.remove();

    const iconos = { exito: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
    const icono = iconos[tipo] || 'fa-info-circle';

    const mensaje = document.createElement('div');
    mensaje.className = `mensaje-popup ${tipo}`;
    mensaje.innerHTML = `<i class="fas ${icono}"></i> ${texto}`;
    document.body.appendChild(mensaje);

    setTimeout(() => mensaje.remove(), 5000);
  }

  function mostrarOverlay(texto) {
    document.getElementById('overlayTexto').textContent = texto;
    document.getElementById('overlayCarga').classList.add('activo');
  }

  function ocultarOverlay() {
    document.getElementById('overlayCarga').classList.remove('activo');
  }

  // ===== GENERAR PDF =====
  function generarPDF(datos, idRegistro, imagenes) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 15;
    const contentWidth = pageWidth - margin * 2;

    // Encabezado
    doc.setFillColor(30, 43, 60);
    doc.rect(0, 0, pageWidth, 30, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.setFont('helvetica', 'bold');
    doc.text('SST PROSERING', margin, 13);
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.text('Registro de Capacitaciones', margin, 21);

    doc.setFontSize(9);
    doc.text(`Registro N°: SST-CAP-${idRegistro || 'XXXX'}`, pageWidth - margin, 13, { align: 'right' });
    doc.text(`Fecha: ${new Date().toLocaleDateString('es-PE')}`, pageWidth - margin, 19, { align: 'right' });
    doc.text(`Hora: ${new Date().toLocaleTimeString('es-PE')}`, pageWidth - margin, 25, { align: 'right' });

    doc.setTextColor(30, 43, 60);

    let y = 40;

    const fila = (label, valor) => {
      if (y > pageHeight - 40) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.text(label + ':', margin, y);
      doc.setFont('helvetica', 'normal');
      const texto = valor || '—';
      const lineas = doc.splitTextToSize(String(texto), contentWidth - 45);
      doc.text(lineas, margin + 45, y);
      y += 5 * lineas.length + 1;
    };

    // Datos generales
    doc.setFillColor(240, 245, 250);
    doc.rect(margin, y, contentWidth, 8, 'F');
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 43, 60);
    doc.text('DATOS GENERALES', margin + 3, y + 5.5);
    y += 12;
    doc.setFontSize(9);
    doc.setTextColor(60, 60, 60);

    fila('Empresa', datos.empresa);
    fila('Capacitador', datos.capacitador);
    fila('Fecha', datos.fecha);
    fila('Tipo de actividad', datos.tipo);
    fila('Tema desarrollado', datos.tema);

    // Asistencia
    y += 3;
    if (y > pageHeight - 60) { doc.addPage(); y = 20; }
    doc.setFillColor(240, 245, 250);
    doc.rect(margin, y, contentWidth, 8, 'F');
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 43, 60);
    doc.text('ASISTENCIA', margin + 3, y + 5.5);
    y += 12;
    doc.setFontSize(9);
    doc.setTextColor(60, 60, 60);

    fila('Programado', datos.total);
    fila('Asistentes', datos.presente);

    // Observaciones
    y += 3;
    if (y > pageHeight - 60) { doc.addPage(); y = 20; }
    doc.setFillColor(240, 245, 250);
    doc.rect(margin, y, contentWidth, 8, 'F');
    doc.setFontSize(11);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 43, 60);
    doc.text('OBSERVACIONES', margin + 3, y + 5.5);
    y += 12;
    doc.setFontSize(9);
    doc.setTextColor(60, 60, 60);

    doc.setFont('helvetica', 'normal');
    const obsLineas = doc.splitTextToSize(datos.observaciones || 'Sin observaciones', contentWidth);
    doc.text(obsLineas, margin, y);
    y += 5 * obsLineas.length + 8;

    // Evidencia fotográfica
    if (imagenes && imagenes.length > 0) {
      if (y > pageHeight - 80) { doc.addPage(); y = 20; }

      doc.setFillColor(240, 245, 250);
      doc.rect(margin, y, contentWidth, 8, 'F');
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(30, 43, 60);
      doc.text('EVIDENCIA FOTOGRÁFICA', margin + 3, y + 5.5);
      y += 14;

      const imgWidth = (contentWidth - 6) / 2;
      const imgHeight = imgWidth * 0.75;

      let col = 0;
      let x = margin;

      for (let i = 0; i < imagenes.length; i++) {
        const img = imagenes[i];

        if (y + imgHeight + 8 > pageHeight - 25) {
          doc.addPage();
          y = 20;
          col = 0;
          x = margin;
        }

        try {
          let formato = 'JPEG';
          if (img.dataUrl.includes('image/png')) formato = 'PNG';
          else if (img.dataUrl.includes('image/webp')) formato = 'WEBP';

          doc.addImage(img.dataUrl, formato, x, y, imgWidth, imgHeight);

          doc.setFontSize(7);
          doc.setTextColor(120, 120, 120);
          const nombreCorto = img.name.length > 30 ? img.name.substring(0, 27) + '...' : img.name;
          doc.text(nombreCorto, x, y + imgHeight + 3);
        } catch (err) {
          console.warn('No se pudo añadir imagen', img.name, err);
        }

        col++;
        if (col === 2) {
          col = 0;
          x = margin;
          y += imgHeight + 8;
        } else {
          x += imgWidth + 6;
        }
      }

      if (col === 1) y += imgHeight + 8;
    } else {
      if (y > pageHeight - 40) { doc.addPage(); y = 20; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(60, 60, 60);
      doc.text('Evidencia fotográfica:', margin, y);
      y += 5;
      doc.setFont('helvetica', 'normal');
      doc.text('Sin evidencia fotográfica adjunta', margin, y);
      y += 8;
    }

    // Pie de página
    const totalPaginas = doc.internal.getNumberOfPages();
    for (let p = 1; p <= totalPaginas; p++) {
      doc.setPage(p);
      doc.setDrawColor(200, 210, 220);
      doc.line(margin, pageHeight - 20, pageWidth - margin, pageHeight - 20);

      doc.setFontSize(8);
      doc.setTextColor(120, 130, 140);
      doc.text('Documento generado automáticamente por SST PROSERING', margin, pageHeight - 13);
      doc.text(`ID: ${idRegistro || 'N/A'}`, margin, pageHeight - 8);
      doc.text(`Página ${p} de ${totalPaginas}`, pageWidth - margin, pageHeight - 13, { align: 'right' });
      doc.text('© 2024 PROSERING App', pageWidth - margin, pageHeight - 8, { align: 'right' });
    }

    return doc;
  }

  // ===== ENVIAR CAPACITACIÓN =====
  async function enviarCapacitacion(event) {
    event.preventDefault();

    const empresa = document.getElementById('empresa')?.value;
    const capacitador = document.getElementById('capacitador')?.value.trim();
    const fecha = document.getElementById('fechaCap')?.value;
    const tipo = document.getElementById('tipoActividad')?.value;
    const tema = document.getElementById('tema')?.value.trim();
    const total = document.getElementById('total')?.value;
    const presente = document.getElementById('presente')?.value;
    const observaciones = document.getElementById('observaciones')?.value.trim() || '';

    if (!empresa || !capacitador || !fecha || !tipo || !tema || !total || !presente) {
      mostrarMensaje('Complete todos los campos obligatorios', 'error');
      return;
    }

    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    btnSubmit.disabled = true;
    btnText.textContent = 'Guardando...';

    try {
      const nombresFotos = archivosSeleccionados.length > 0
        ? archivosSeleccionados.map(f => f.name).join(', ')
        : '';

      mostrarOverlay('Guardando registro de capacitación...');

      const datos = {
        empresa,
        capacitador,
        fecha,
        tipo,
        tema,
        total: parseInt(total),
        presente: parseInt(presente),
        observaciones,
        evidencia: nombresFotos
      };

      console.log('📤 Enviando a Supabase:', datos);

      const { data, error } = await supabaseClient
        .from('capacitaciones')
        .insert([datos])
        .select();

      if (error) {
        console.error('Error Supabase:', error);
        mostrarMensaje('Error al guardar: ' + error.message, 'error');
        return;
      }

      const idRegistro = data && data[0] ? data[0].id : null;
      console.log('✅ Capacitación guardada con ID:', idRegistro);

      mostrarOverlay('Generando PDF con imágenes...');
      await new Promise(r => setTimeout(r, 300));

      const doc = generarPDF(datos, idRegistro, imagenesBase64);
      doc.save(`Capacitacion_${idRegistro || Date.now()}.pdf`);

      mostrarMensaje('Capacitación guardada y PDF descargado', 'exito');

      document.getElementById('formCapacitacion').reset();
      document.getElementById('fechaCap').value = '2026-03-20';
      archivosSeleccionados = [];
      imagenesBase64 = [];
      renderPreview();

    } catch (err) {
      console.error('Error general:', err);
      mostrarMensaje('Error: ' + err.message, 'error');
    } finally {
      btnSubmit.disabled = false;
      btnText.textContent = 'Guardar y descargar PDF';
      ocultarOverlay();
    }
  }

  // ===== INICIALIZAR =====
  window.addEventListener('load', function() {
    const fileInput = document.getElementById('fileInput');
    if (fileInput) fileInput.addEventListener('change', manejarSeleccionFotos);
  });
</script>
